<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Smart Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .chalkboard {
            background-color: #1e3a3a;
            background-image: radial-gradient(#2d5a5a 1px, transparent 1px);
            background-size: 25px 25px;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
        }
        .chat-container { height: calc(100vh - 160px); }
        .board-container { height: calc(100vh - 160px); }
    </style>
</head>
<body class="bg-gray-100 overflow-hidden">

    <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold text-blue-800">🏫 Lớp Học AI 4.0</h1>
        <div id="status" class="text-xs font-semibold px-3 py-1 rounded-full bg-gray-200 uppercase">Đang đợi kết nối</div>
    </header>

    <div class="grid grid-cols-12 gap-4 p-4">
        
        <div class="col-span-7">
            <div class="board-container chalkboard rounded-3xl shadow-2xl p-8 overflow-y-auto border-8 border-[#3d2b1f]">
                <div class="text-center border-b border-gray-600 mb-6 pb-2 opacity-50 text-sm italic">BẢNG GIẢNG BÀI</div>
                <div id="whiteboard-content" class="text-2xl space-y-6 leading-relaxed">
                    $$ E = mc^2 $$
                </div>
            </div>
        </div>

        <div class="col-span-5 flex flex-col gap-4">
            <div id="chat-box" class="chat-container bg-white rounded-3xl shadow-lg p-6 overflow-y-auto space-y-4">
                <div class="bg-blue-50 p-4 rounded-2xl text-blue-800 text-sm">
                    <b>Thầy giáo:</b> Chào em! Em cần thầy giảng phần nào trong chương trình hôm nay?
                </div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="chat-input" class="flex-1 p-4 rounded-2xl border-none shadow-md outline-none" placeholder="Gõ câu hỏi...">
                <button id="send-btn" class="bg-blue-600 text-white px-6 rounded-2xl font-bold shadow-md hover:bg-blue-700">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        const ASSISTANT_ID = "7d17a5b8-d627-4224-9ef9-0b404de6edd2"; 
        const PUBLIC_KEY = "99789d88-4ebb-44ee-883c-f616591603f1"; 
        let vapiInstance = null;

        (function (d, s, id) {
            var js, vjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
            vjs.parentNode.insertBefore(js, vjs);

            js.onload = () => {
                vapiInstance = window.vapiSDK.run({
                    apiKey: PUBLIC_KEY,
                    assistant: ASSISTANT_ID,
                    config: { display: { position: "bottom-left" } }
                });

                vapiInstance.on('message', (message) => {
                    if (message.type === 'transcript' && message.role === 'assistant') {
                        processAIResponse(message.transcript);
                    }
                });

                vapiInstance.on('call-start', () => updateStatus('Đang giảng bài', 'bg-green-500 text-white'));
            };
        })(document, "script", "vapi-sdk");

        function processAIResponse(text) {
            const chatBox = document.getElementById('chat-box');
            const board = document.getElementById('whiteboard-content');

            // 1. Hiển thị toàn bộ lời nói vào Chat
            const msgDiv = document.createElement('div');
            msgDiv.className = "bg-gray-100 p-3 rounded-2xl text-gray-700 text-sm self-start";
            msgDiv.innerHTML = `<b>Thầy:</b> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Tách Công thức Toán học ra Bảng (Tìm nội dung giữa các dấu $)
            const mathRegex = /(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$)/g;
            const matches = text.match(mathRegex);

            if (matches) {
                matches.forEach(formula => {
                    const formulaDiv = document.createElement('div');
                    formulaDiv.className = "p-4 bg-white/5 rounded-lg border border-white/10 text-center animate-pulse";
                    formulaDiv.innerHTML = formula;
                    board.appendChild(formulaDiv);
                });
                
                // Render lại MathJax
                if (window.MathJax) MathJax.typesetPromise();
                board.parentElement.scrollTop = board.parentElement.scrollHeight;
            }
        }

        // Gửi tin nhắn
        const inputField = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            const text = inputField.value.trim();
            if (text && vapiInstance) {
                vapiInstance.say(text, true);
                const chatBox = document.getElementById('chat-box');
                chatBox.innerHTML += `<div class="bg-blue-600 p-3 rounded-2xl text-white text-sm self-end ml-auto max-w-[80%]">${text}</div>`;
                inputField.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function updateStatus(txt, cls) {
            const s = document.getElementById('status');
            s.innerText = txt;
            s.className = `text-xs font-semibold px-3 py-1 rounded-full ${cls}`;
        }
    </script>
</body>
</html>
