<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Smart Classroom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chalkboard {
            background-color: #1e3a3a;
            background-image: radial-gradient(#2d5a5a 1px, transparent 1px);
            background-size: 25px 25px;
            color: #f8fafc;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }
        .chat-container { height: calc(100vh - 180px); }
        .board-container { height: calc(100vh - 180px); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 overflow-hidden">

    <header class="bg-white border-b p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🎓</span>
            <h1 class="text-xl font-bold text-slate-800">Lớp Học AI Tutor</h1>
        </div>
        <div id="status" class="text-[10px] font-bold px-3 py-1 rounded-full bg-slate-200 text-slate-500 uppercase tracking-tighter">Chưa kết nối</div>
    </header>

    <div class="grid grid-cols-12 gap-6 p-6">
        
        <div class="col-span-7">
            <div class="board-container chalkboard rounded-[2rem] p-10 overflow-y-auto border-[12px] border-[#3d2b1f] relative custom-scrollbar">
                <div class="absolute top-4 left-1/2 -translate-x-1/2 opacity-30 text-xs tracking-[0.3em]">GIÁO ÁN ĐIỆN TỬ</div>
                <div id="whiteboard-content" class="text-3xl space-y-8 mt-4 text-center">
                    <div class="opacity-40 text-lg italic mt-20">Đang đợi nội dung giảng dạy...</div>
                </div>
            </div>
        </div>

        <div class="col-span-5 flex flex-col gap-4">
            <div id="chat-box" class="chat-container bg-white rounded-[2rem] shadow-xl p-6 overflow-y-auto flex flex-col gap-4 border border-slate-100 custom-scrollbar">
                <div class="bg-slate-100 p-4 rounded-2xl text-slate-600 text-sm italic self-start max-w-[90%]">
                    <b>Hệ thống:</b> Chào em, hãy nhấn nút Micro hoặc gõ text để bắt đầu học nhé!
                </div>
            </div>

            <div class="flex gap-2 bg-white p-2 rounded-2xl shadow-lg border border-slate-100">
                <input type="text" id="chat-input" class="flex-1 p-3 px-5 outline-none text-slate-700" placeholder="Hỏi thầy điều gì đó...">
                <button id="send-btn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 active:scale-95 transition-all">
                    Gửi
                </button>
            </div>
        </div>
    </div>

    <script>
        const ASSISTANT_ID = "7d17a5b8-d627-4224-9ef9-0b404de6edd2"; 
        const PUBLIC_KEY = "99789d88-4ebb-44ee-883c-f616591603f1"; 
        let vapiInstance = null;

        (function (d, s, id) {
            var js, vjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) return;
            js = d.createElement(s); js.id = id;
            js.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
            vjs.parentNode.insertBefore(js, vjs);

            js.onload = () => {
                vapiInstance = window.vapiSDK.run({
                    apiKey: PUBLIC_KEY,
                    assistant: ASSISTANT_ID,
                    config: { display: { position: "bottom-left" } }
                });
                vapiInstance.on('message', (message) => {
                    // 1. Luôn hiển thị lời nói bình thường vào Chat
                    if (message.type === 'transcript' && message.role === 'assistant') {
                        const chatBox = document.getElementById('chat-box');
                        const msgDiv = document.createElement('div');
                        msgDiv.className = "bg-blue-50 p-4 rounded-2xl text-slate-700 text-sm self-start max-w-[90%] shadow-sm mb-2";
                        msgDiv.innerHTML = `<b class="text-blue-600">Thầy:</b> ${message.transcript}`;
                        chatBox.appendChild(msgDiv);
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }

                    // 2. CHÍNH LÀ ĐÂY: Lắng nghe khi AI gọi hàm viết bảng
                    if (message.type === 'tool-calls') {
                        const toolCall = message.toolCalls[0];
                        if (toolCall.function.name === 'update_whiteboard') {
                            const args = JSON.parse(toolCall.function.arguments);
                            const board = document.getElementById('whiteboard-content');
                            
                            if (board.innerText.includes("Đang đợi")) board.innerHTML = "";

                            const formulaDiv = document.createElement('div');
                            formulaDiv.className = "p-6 bg-white/5 rounded-2xl border border-white/10 text-center animate-in fade-in zoom-in duration-700";
                            formulaDiv.innerHTML = args.content; // Nội dung AI gửi qua hàm
                            
                            board.appendChild(formulaDiv);
                            
                            if (window.MathJax) MathJax.typesetPromise();
                            board.parentElement.scrollTop = board.parentElement.scrollHeight;
                        }
                    }
                });

                vapiInstance.on('call-start', () => updateStatus('Đang giảng bài', 'bg-green-500 text-white'));
                vapiInstance.on('call-end', () => updateStatus('Sẵn sàng', 'bg-slate-200 text-slate-500'));
            };
        })(document, "script", "vapi-sdk");

        function processAIResponse(text) {
            const chatBox = document.getElementById('chat-box');
            const board = document.getElementById('whiteboard-content');

            // 1. Hiển thị lời nói của AI vào Chat (loại bỏ các thẻ tag để chat trông sạch sẽ)
            const cleanTextForChat = text.replace(/\[BOARD\][\s\S]*?\[\/BOARD\]/g, '').trim();
            if (cleanTextForChat) {
                const msgDiv = document.createElement('div');
                msgDiv.className = "bg-blue-50 p-4 rounded-2xl text-slate-700 text-sm self-start max-w-[90%] shadow-sm border border-blue-100 mb-2";
                msgDiv.innerHTML = `<b class="text-blue-600">Thầy:</b> ${cleanTextForChat}`;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            // 2. Tách nội dung dành riêng cho Bảng
            // Hỗ trợ cả thẻ [BOARD] và công thức Toán $$
            const boardRegex = /\[BOARD\]([\s\S]*?)\[\/BOARD\]|\$\$([\s\S]*?)\$\$|\$([\s\S]*?)\$/g;
            let match;
            
            while ((match = boardRegex.exec(text)) !== null) {
                if (board.innerText.includes("Đang đợi")) board.innerHTML = "";
                
                // Lấy nội dung bên trong cặp thẻ hoặc dấu $
                const content = match[1] || match[2] || match[3];
                
                const formulaDiv = document.createElement('div');
                formulaDiv.className = "p-6 bg-white/5 rounded-2xl border border-white/10 text-center shadow-inner animate-in fade-in slide-in-from-bottom-4 duration-700";
                
                // Nếu là công thức toán thì bọc lại bằng $$ để MathJax hiểu
                formulaDiv.innerHTML = (match[2] || match[3]) ? `$$ ${content} $$` : content;
                
                board.appendChild(formulaDiv);
            }
            
            if (window.MathJax) MathJax.typesetPromise();
            board.parentElement.scrollTop = board.parentElement.scrollHeight;
        }

        // Xử lý gửi tin nhắn văn bản
        const inputField = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function sendMessage() {
            const text = inputField.value.trim();
            if (text && vapiInstance) {
                // SỬ DỤNG HÀM SEND VỚI TYPE 'ADD-MESSAGE'
                vapiInstance.send({
                    type: "add-message",
                    message: {
                        role: "user",
                        content: text
                    }
                });

                // Hiển thị nội dung người dùng vừa gõ vào Chat
                const chatBox = document.getElementById('chat-box');
                const userDiv = document.createElement('div');
                userDiv.className = "bg-blue-600 p-4 rounded-2xl text-white text-sm self-end max-w-[90%] shadow-md";
                userDiv.innerHTML = text;
                chatBox.appendChild(userDiv);
                
                inputField.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function updateStatus(txt, cls) {
            const s = document.getElementById('status');
            s.innerText = txt;
            s.className = `text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-tighter ${cls}`;
        }
    </script>
</body>
</html>
